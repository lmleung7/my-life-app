<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>My Life</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="shared.css">
<style>
body{ --bg:#f6f7f9; --card:#fff; --fg:#1a1d21; --panel:#fff; --muted:#6b7280; --line:#e5e7eb; --accent:#2563eb; margin:0; font:15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; background:var(--bg); color:var(--fg); }
@media (prefers-color-scheme: dark){ body{ --bg:#111418; --card:#1b1f25; --fg:#e8eaed; --panel:#1b1f25; --muted:#9aa3af; --line:#2c323a; --accent:#6ea0ff; } }
main{ max-width:820px; margin:0 auto; padding:16px; }
h1{ font-size:20px; margin:8px 0 16px; }
.muted{ color:var(--muted); }
.center{ text-align:center; padding:56px 16px; }
.modules{ display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); gap:12px; }
.card{ display:flex; align-items:center; gap:14px; padding:16px; border-radius:12px; border:1px solid var(--line); background:var(--card); color:var(--fg); text-decoration:none; }
.card:hover{ border-color:var(--accent); }
.card svg{ flex:none; width:28px; height:28px; fill:none; stroke:currentColor; stroke-width:1.75; stroke-linecap:round; stroke-linejoin:round; }
.card b{ display:block; font-size:16px; }
.card span{ color:var(--muted); font-size:13px; }
.retry{ font:inherit; margin-top:12px; padding:8px 14px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--fg); cursor:pointer; }
</style>
</head>
<body>
<div class="topnav" id="topnav" hidden>
  <span></span>
  <div class="navacct">
    <span id="who" class="navemail"></span>
    <button id="signout" class="so">Sign out</button>
  </div>
</div>

<section id="signin" class="gate" hidden>
  <p>Family only. Sign in with your Google account.</p>
  <button id="google" class="gbtn">Sign in with Google</button>
</section>

<main id="home" hidden>
  <h1>My Life</h1>
  <p id="message" class="muted center" hidden></p>
  <nav id="modules" class="modules" aria-label="Modules">
    <a id="m-receipts" class="card" href="receipts.html" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 3v18"/><path d="M16.5 7.5C15.8 6.4 14.2 5.8 12 5.8c-2.6 0-4.1 1.1-4.1 2.8 0 4.2 8.2 1.9 8.2 6.1 0 1.7-1.6 3.3-4.1 3.3-2.3 0-4.1-.8-5-2.1"/></svg>
      <div><b>Receipts</b><span>Spending and receipt breakdowns</span></div>
    </a>
    <a id="m-stmts" class="card" href="statements.html" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 9.5l9-5.5 9 5.5z"/><path d="M5.5 12.5v5M9.5 12.5v5M14.5 12.5v5M18.5 12.5v5"/><path d="M3.5 20.5h17"/></svg>
      <div><b>Statements</b><span>Bank, card and savings statements</span></div>
    </a>
  </nav>
</main>

<script src="shared.js"></script>
<script>
(() => {
  // Old bookmarks: index.html#/st/... and #/receipts now live on their own pages.
  const h = location.hash;
  if (/^#\/st(\/|$)/.test(h)) { location.replace('statements.html' + location.search + '#' + h.slice(4)); return; }
  if (/^#\/receipts/.test(h)) { location.replace('receipts.html' + location.search); return; }

  // Which modules can this account open? This only decides which links to show.
  // It is not access control: each module page checks the session itself, and row-level security limits the data.
  const probes = {
    receipts: async () => { const { error, data } = await db.from('receipts').select('id').limit(1); return error ? null : data.length > 0; },
    stmts: async () => { const { error, data } = await db.from('fin_institution_overview').select('id').limit(1); return error ? null : data.length > 0; }
  };

  const say = text => { $('message').textContent = text; show('message', true); };
  let session = null;

  async function showModules() {
    show('message', false);
    $('m-receipts').hidden = $('m-stmts').hidden = true;
    say('Checking what you can open…');
    const [r, s] = DEMO ? [true, true] : await Promise.all([probes.receipts(), probes.stmts()]);   // demo: the receipts page just says it is not loaded
    $('m-receipts').hidden = !r;
    $('m-stmts').hidden = !s;
    if (r === null && s === null) return retry('Could not check your access. Check your connection and try again.');
    if (!r && !s) return say('This Google account has no modules available.');
    show('message', false);
  }

  function retry(text) {
    say(text);
    const b = document.createElement('button');
    b.className = 'retry';
    b.textContent = 'Try again';
    b.onclick = showModules;
    $('message').append(document.createElement('br'), b);
  }

  function onSession(s) {
    const prev = session;
    session = s;
    if (prev && s && prev.user.id === s.user.id) return;   // token refresh / tab refocus: leave the page as it is
    show('signin', !s);
    show('topnav', !!s);
    show('home', !!s);
    if (!s) return;
    $('who').textContent = s.user.email || '';
    if (location.search.includes('code=')) history.replaceState(null, '', location.pathname + location.hash);
    showModules();
  }

  if (DEMO) {
    document.querySelectorAll('.card').forEach(a => { a.href += location.search; });
    $('signout').hidden = true;
    onSession({ user: { id: 'demo', email: 'demo mode' } });
  } else {
    $('google').onclick = () => db.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: appBase() } });
    $('signout').onclick = () => db.auth.signOut();
    db.auth.onAuthStateChange((_event, s) => { setTimeout(() => onSession(s), 0); });
  }
})();
</script>
</body>
</html>
