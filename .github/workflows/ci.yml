name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  html:
    name: HTML validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate HTML
        run: npx --yes html-validate@9 index.html

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan tracked files for secrets
        run: |
          python3 - <<'PY'
          import base64, json, re, subprocess, sys

          # Only the publishable Supabase key (sb_publishable_...) may appear in this repo.
          # Findings print file, line and rule name only, never the matched value: CI logs are public.
          RULES = {
              "Supabase secret key": r"sb_secret_[A-Za-z0-9_\-]{16,}",
              "Google OAuth client secret": r"GOCSPX-[A-Za-z0-9_\-]{16,}",
              "Private key block": r"-----BEGIN [A-Z ]*PRIVATE KEY-----",
              "AWS access key id": r"\bAKIA[0-9A-Z]{16}\b",
              "GitHub token": r"\bgh[pousr]_[A-Za-z0-9]{30,}\b",
              "Database URL with password": r"postgres(?:ql)?://[^:\s/]+:[^@\s]+@",
              "service_role assigned a value": r"service_role[\"']?\s*[:=]\s*[\"'][^\"']{8,}",
          }
          JWT = re.compile(r"eyJ[A-Za-z0-9_\-]{8,}\.([A-Za-z0-9_\-]{8,})\.[A-Za-z0-9_\-]{8,}")
          ADMIN_ROLES = {"service_role", "supabase_admin"}

          files = subprocess.check_output(["git", "ls-files"], text=True).splitlines()
          findings = []
          for path in files:
              try:
                  text = open(path, encoding="utf-8").read()
              except (UnicodeDecodeError, IsADirectoryError, FileNotFoundError):
                  continue
              for lineno, line in enumerate(text.splitlines(), 1):
                  for name, pattern in RULES.items():
                      if re.search(pattern, line):
                          findings.append((path, lineno, name))
                  for m in JWT.finditer(line):
                      payload = m.group(1)
                      payload += "=" * (-len(payload) % 4)
                      try:
                          role = json.loads(base64.urlsafe_b64decode(payload)).get("role")
                      except Exception:
                          continue
                      if role in ADMIN_ROLES:
                          findings.append((path, lineno, "JWT with admin role"))

          if findings:
              for path, lineno, name in findings:
                  print(f"::error file={path},line={lineno}::{name} detected (value hidden)")
              sys.exit(1)
          print(f"Scanned {len(files)} tracked files: no secrets found")
          PY
